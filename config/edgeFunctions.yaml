kind: EdgeFunctions
version: "1"
data:
  functions:
    - name: youtube-captions
  secrets:
    - key: YOUTUBE_OAUTH_CLIENT_ID
      value: ${{YOUTUBE_OAUTH_CLIENT_ID}}
    - key: YOUTUBE_OAUTH_CLIENT_SECRET
      value: ${{YOUTUBE_OAUTH_CLIENT_SECRET}}
    - key: YOUTUBE_OAUTH_REFRESH_TOKEN
      value: ${{YOUTUBE_OAUTH_REFRESH_TOKEN}}
